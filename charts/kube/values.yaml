# Default service configuration that can be reused
_defaults: &defaults
  replicaCount: 1
  enabled: true
  service:
    type: NodePort
    port: 80
  resources:
    limits:
      cpu: 300m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

# Core chart configuration
replicaCount: 1
image:
  repository: nginx
  pullPolicy: Always
  tag: ""
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
service:
  type: NodePort
  port: 80
  nodePort: 30080
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
resources: {}
livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}

# Services configuration
services:
  ambrosia:
    <<: *defaults
    replicaCount: 1
    image:
      repository: wazobiatech/ambrosia
      tag: "latest"
      pullPolicy: Always
    service:
      type: NodePort
      port: 80
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 250m
        memory: 256Mi

  anubis:
    <<: *defaults
    replicaCount: 1
    image:
      repository: wazobiatech/anubis
      tag: "latest"
      pullPolicy: Always
    service:
      type: NodePort
      port: 80
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 250m
        memory: 256Mi

  hermes:
    <<: *defaults
    replicaCount: 1
    image:
      repository: wazobiatech/hermes
      tag: "latest"
      pullPolicy: Always
    service:
      type: NodePort
      port: 80
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 250m
        memory: 256Mi

  muse:
    <<: *defaults
    replicaCount: 1
    image:
      repository: wazobiatech/muse
      tag: "latest"
      pullPolicy: Always
    service:
      type: NodePort
      port: 80
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 250m
        memory: 256Mi
