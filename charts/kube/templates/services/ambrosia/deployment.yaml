apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-ambrosia
  labels:
    {{- include "kube.labels" . | nindent 4 }}
    app.kubernetes.io/component: ambrosia
spec:
  replicas: {{ .Values.services.ambrosia.replicaCount }}
  selector:
    matchLabels:
      {{- include "kube.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ambrosia
  template:
    metadata:
      labels:
        {{- include "kube.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ambrosia
    spec:
      imagePullSecrets:
        - name: regcred
      initContainers:
        - name: copy-app-files
          image: wazobiatech/ambrosia:latest
          command: ['sh', '-c', 'mkdir -p /app-temp/public && cp -r /var/www/html/. /app-temp/']
          volumeMounts:
          - name: app-code
            mountPath: /app-temp
      containers:
        # PHP-FPM container
        - name: {{ .Chart.Name }}-ambrosia
          image: "{{ .Values.services.ambrosia.image.repository }}:{{ .Values.services.ambrosia.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.services.ambrosia.image.pullPolicy }}
          volumeMounts:
            - name: app-code
              mountPath: /var/www/html
          ports:
            - containerPort: 9000
              name: php-fpm
          # env:
          #   - name: KAFKA_BROKERS
          #     value: "{{ .Release.Name }}-kafka:9092"
          # livenessProbe:
          #   exec:
          #     command: ["php", "artisan", "health:check", "--quiet"]
          #   initialDelaySeconds: 30
          #   periodSeconds: 90
          #   timeoutSeconds: 10
          #   failureThreshold: 3
          # readinessProbe:
          #   exec:
          #     command: ["php", "artisan", "health:check", "--quiet"]
          #   initialDelaySeconds: 30
          #   periodSeconds: 90
          #   timeoutSeconds: 10
          #   failureThreshold: 3
          resources:
            {{- toYaml .Values.services.ambrosia.resources | nindent 12 }}

        # Nginx container
        - name: nginx
          image: nginx:1.25
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: app-code
              mountPath: /var/www/html
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: app-code
          emptyDir: {}
        - name: nginx-config
          configMap:
            name: ambrosia-nginx-config
