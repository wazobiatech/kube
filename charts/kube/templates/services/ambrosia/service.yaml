apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-ambrosia
  labels:
    {{- include "kube.labels" . | nindent 4 }}
    app.kubernetes.io/component: ambrosia
spec:
  type: {{ .Values.services.ambrosia.service.type }}
  ports:
    - port: {{ .Values.services.ambrosia.service.port }}
      nodePort: {{ .Values.services.ambrosia.service.nodePort }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "kube.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ambrosia
